services:
  postgres:
    image: postgres:16-alpine
    container_name: indexpilot-postgres
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: indexpilot
      POSTGRES_DB: indexpilot
    volumes:
      - indexpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U indexpilot -d indexpilot']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: indexpilot-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - indexpilot_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: indexpilot:latest
    container_name: indexpilot-api
    command: ['node', 'apps/api/dist/index.js']
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - indexpilot_storage:/app/tmp/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: indexpilot:latest
    container_name: indexpilot-worker
    command: ['node', 'apps/worker/dist/index.js']
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - indexpilot_storage:/app/tmp/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: indexpilot:latest
    container_name: indexpilot-web
    command: ['pnpm', '--filter', '@indexpilot/web', 'start']
    restart: unless-stopped
    env_file: .env.production
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api
    networks:
      - default
      - proxy

volumes:
  indexpilot_pgdata:
  indexpilot_redisdata:
  indexpilot_storage:

networks:
  proxy:
    external: true
    name: shared-network
